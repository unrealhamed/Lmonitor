<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مسیر — دموی مالی هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@property --rx{syntax:'<angle>';inherits:true;initial-value:58deg}
@property --rz{syntax:'<angle>';inherits:true;initial-value:-12deg}
@property --zoom{syntax:'<number>';inherits:true;initial-value:1}
@property --tx{syntax:'<length>';inherits:true;initial-value:0px}
@property --ty{syntax:'<length>';inherits:true;initial-value:0px}
:root{
  --ocean-950:#061b30;--ocean-900:#082640;--ocean-800:#0d3a5f;--ocean-700:#12507c;--ocean-500:#1f7bb0;--ocean-300:#86bcd9;--ocean-100:#e1eef6;
  --mint:#1fd39a;--mint-600:#12b583;--mint-700:#0c9a6f;--mint-100:#d8f7eb;
  --coral:#ff8a5b;--coral-600:#f06d3c;--coral-100:#ffeadf;
  --red:#ef4a5a;--red-100:#fde3e6;--amber:#f5b83d;--amber-100:#fdf1d8;
  --bg:#edf2f5;--surface:rgba(255,255,255,.76);--line:rgba(12,40,66,.08);
  --text:#0d2236;--text-2:#3b5166;--muted:#7b8b9c;
  --r:22px;--r-sm:14px;
  --shadow:0 14px 34px -16px rgba(10,42,71,.28),0 2px 6px rgba(10,42,71,.05);
  --shadow-lg:0 30px 70px -24px rgba(10,42,71,.45);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100dvh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;font-size:14px;line-height:1.6}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.ic{flex:none;display:block}
.num{font-feature-settings:"tnum";letter-spacing:-.2px}
.muted{color:var(--muted)}.t2{color:var(--text-2)}
.up{color:var(--mint-700)}.dn{color:var(--red)}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100dvh}
main{flex:1;min-width:0;position:relative;isolation:isolate}
.bg-hero{position:absolute;inset:0 0 auto 0;height:760px;z-index:-1;pointer-events:none;
  background:
   radial-gradient(700px 360px at 12% 0%,rgba(31,211,154,.32),transparent 62%),
   radial-gradient(620px 420px at 92% 18%,rgba(31,123,176,.55),transparent 66%),
   radial-gradient(500px 260px at 40% 62%,rgba(31,211,154,.22),transparent 70%),
   linear-gradient(180deg,#072039 0,#0d3a5f 230px,#2c6f8c 400px,#9cc6cf 560px,#dde9ed 680px,var(--bg) 760px)}
.page{padding:0 28px 56px;max-width:1340px;margin:0 auto}
.sidebar{position:sticky;top:0;height:100dvh;width:272px;flex:none;padding:22px 14px 18px;background:linear-gradient(180deg,#071f36 0%,#0b3354 100%);color:#c6dbe8;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff}
.brand-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),#16a2b8);box-shadow:0 8px 22px -6px rgba(31,211,154,.7)}
.brand b{font-size:19px;font-weight:900;display:block;line-height:1.1}
.brand small{font-size:11px;color:#8fb2c7}
.nav-h{font-size:11px;font-weight:700;color:#6f93ab;padding:14px 12px 6px;letter-spacing:.3px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;font-weight:500;font-size:13.5px;color:#b9d0df;transition:.2s;position:relative}
.nav-a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-a.active{background:linear-gradient(90deg,rgba(31,211,154,.08),rgba(31,211,154,.2));color:#fff}
.nav-a.active::before{content:'';position:absolute;right:-14px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.nav-a.active .ic{color:var(--mint)}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.side-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.side-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#d7e7f1;font-size:12.5px;font-weight:600}
.side-btn:hover{background:rgba(255,255,255,.12)}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(20px + var(--safe-t)) 0 18px;color:#fff}
.tb-r{display:flex;align-items:center;gap:14px;min-width:0}
.tb-l{display:flex;align-items:center;gap:10px}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#bfe9ff,#7cc6e8);display:grid;place-items:center;font-size:31px;border:3px solid rgba(255,255,255,.9);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.25);flex:none}
.avatar::after{content:'';position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--mint);border:2.5px solid #0d3a5f}
.hello b{font-size:20px;font-weight:800;display:block;line-height:1.3}
.hello span{font-size:13px;color:#b8d3e3;display:flex;align-items:center;gap:5px}
.hello span .ic{color:var(--mint)}
.tb-title{font-size:21px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:12px;color:#a9c8da}
.icon-btn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;transition:.2s;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn .dot{position:absolute;top:9px;left:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid #0d3a5f}
.xp-chip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);font-size:12.5px;font-weight:700;cursor:pointer}
.xp-chip .lv{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--amber),var(--coral));font-weight:900;font-size:13px}
.demo-pill{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:4px 9px;border-radius:999px;border:1px dashed rgba(255,255,255,.5);color:#fff;background:rgba(255,138,91,.25)}
.subnav{display:none;gap:8px;overflow-x:auto;padding:0 0 16px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#e5f1f8;font-size:13px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.subnav a.active{background:#fff;color:var(--ocean-800);border-color:#fff}
.subnav a.active .ic{color:var(--mint-600)}

/* ---------- bottom nav ---------- */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 6px calc(12px + var(--safe-b));background:linear-gradient(180deg,rgba(16,58,90,.94),rgba(7,32,56,.98));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px 28px 0 0;justify-content:space-around;box-shadow:0 -12px 34px rgba(8,34,58,.28)}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;color:#93adc1;font-size:11.5px;font-weight:600;padding:6px 4px;position:relative;background:none;border:0;flex:1;transition:.2s}
.bn.active{color:#fff}
.bn.active .ic{color:var(--mint)}
.bn.active::after{content:'';position:absolute;bottom:-5px;width:34px;height:3px;border-radius:3px;background:var(--mint);box-shadow:0 0 12px var(--mint)}

/* ---------- cards & ui ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.mt{margin-top:16px}.mt2{margin-top:24px}
.card{background:var(--surface);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;min-width:0}
.card.dark{background:linear-gradient(145deg,rgba(18,80,124,.62),rgba(8,38,64,.82));border:1px solid rgba(255,255,255,.16);color:#fff;box-shadow:var(--shadow-lg)}
.card.click{cursor:pointer;transition:transform .25s,box-shadow .25s}
.card.click:hover{transform:translateY(-3px);box-shadow:0 22px 44px -18px rgba(10,42,71,.38)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.ch h3 .ic{color:var(--mint-600)}
.dark .ch h3 .ic{color:var(--mint)}
.ch .link{font-size:13px;font-weight:700;color:var(--ocean-500);display:flex;align-items:center;gap:4px;background:none;border:0}
.sec-title{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.kpi small{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-size:22px;font-weight:800;display:block;line-height:1.4}
.dark .kpi small{color:#a9c8da}
.big{font-size:36px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
.unit{font-size:14px;font-weight:600;color:var(--muted);margin-inline-start:4px}
.dark .unit{color:#cfe3ef}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint-100);color:var(--mint-700);white-space:nowrap}
.tag.coral{background:var(--coral-100);color:var(--coral-600)}
.tag.red{background:var(--red-100);color:var(--red)}
.tag.blue{background:var(--ocean-100);color:var(--ocean-700)}
.tag.amber{background:var(--amber-100);color:#b07a0b}
.tag.gray{background:rgba(13,34,54,.06);color:var(--text-2)}
.tag.solid{background:var(--mint);color:#053a2a}
.demo{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:6px;border:1px dashed var(--coral);color:var(--coral-600);background:rgba(255,138,91,.08);vertical-align:middle;white-space:nowrap}
.dark .demo{color:#ffc3a8;border-color:#ffb08c;background:rgba(255,138,91,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:14px;border:0;font-weight:700;font-size:14px;transition:.2s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,#25e0a5,var(--mint-600));color:#04382a;box-shadow:0 10px 22px -10px rgba(18,181,131,.8)}
.btn-p:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-o{background:linear-gradient(135deg,var(--ocean-500),var(--ocean-800));color:#fff;box-shadow:0 10px 22px -10px rgba(18,80,124,.8)}
.btn-c{background:linear-gradient(135deg,#ffa47e,var(--coral-600));color:#fff;box-shadow:0 10px 22px -10px rgba(240,109,60,.8)}
.btn-g{background:rgba(13,34,54,.06);color:var(--text)}
.btn-g:hover{background:rgba(13,34,54,.1)}
.btn-r{background:var(--red-100);color:var(--red)}
.btn-w{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:flex;background:rgba(13,34,54,.06);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:11px;font-weight:700;font-size:13px;color:var(--text-2);transition:.2s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ocean-800);box-shadow:0 4px 12px -4px rgba(10,42,71,.25)}
.dark .seg{background:rgba(255,255,255,.08)}
.dark .seg button{color:#cfe3ef}.dark .seg button.on{background:#fff;color:var(--ocean-800)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.7);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ocean-800);color:#fff;border-color:var(--ocean-800)}
.pbar{height:8px;border-radius:9px;background:rgba(13,34,54,.08);overflow:hidden;position:relative}
.pbar>i{position:absolute;inset:0 0 0 auto;width:0;border-radius:9px;background:linear-gradient(90deg,var(--mint),#45e6b4);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dark .pbar{background:rgba(255,255,255,.14)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin:14px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.ibox{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--ocean-100);color:var(--ocean-700);font-size:20px}
.ibox.mint{background:var(--mint-100);color:var(--mint-700)}
.ibox.coral{background:var(--coral-100);color:var(--coral-600)}
.ibox.red{background:var(--red-100);color:var(--red)}
.ibox.amber{background:var(--amber-100);color:#b07a0b}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs12{font-size:12px}.fs13{font-size:13px}.fw7{font-weight:700}.fw8{font-weight:800}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.7}
.note .ic{margin-top:2px;color:var(--ocean-500)}
.callout{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.75;background:var(--ocean-100);color:var(--ocean-800)}
.callout.mint{background:var(--mint-100);color:#075a42}
.callout.coral{background:var(--coral-100);color:#8a3512}
.callout.red{background:var(--red-100);color:#8d1825}
.callout .ic{margin-top:3px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--text-2)}
.input{width:100%;border:1px solid rgba(13,34,54,.12);background:rgba(255,255,255,.85);border-radius:13px;padding:11px 13px;font-size:16px;outline:none;transition:.2s}
.input:focus{border-color:var(--mint-600);box-shadow:0 0 0 4px rgba(31,211,154,.18)}
.dark .input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:linear-gradient(to left,var(--mint) var(--p,50%),rgba(13,34,54,.1) var(--p,50%));outline:none}
.dark input[type=range]{background:linear-gradient(to left,var(--mint) var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--mint-600);box-shadow:0 4px 12px rgba(10,42,71,.3);cursor:grab}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:5px solid var(--mint-600);cursor:grab}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(13,34,54,.18);transition:.25s;cursor:pointer}
.switch span::after{content:'';position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--mint-600)}
.switch input:checked+span::after{right:22px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:right;font-weight:700;color:var(--muted);font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.table tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* charts */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}
.ring-p{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring>span{position:relative;font-weight:800;font-size:14px}
.donut{position:relative;display:grid;place-items:center;flex:none}
.donut svg{position:absolute;inset:0}
.dseg{transition:opacity .2s}
.dseg:hover{opacity:.8}
.donut-c{position:relative;text-align:center;line-height:1.35}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade 1s .4s both}
@keyframes fade{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .off{opacity:.35}
.tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,32,56,.94);color:#fff;font-size:12px;padding:7px 10px;border-radius:10px;line-height:1.7;opacity:0;transition:opacity .15s;max-width:240px;box-shadow:0 10px 24px rgba(0,0,0,.25);white-space:pre-line}
.tip.show{opacity:1}
.minibars{display:flex;align-items:flex-end;gap:5px;height:56px}
.minibars{flex:none}
.mkt-spark{margin-top:6px}.mkt-spark svg{width:100%!important;height:44px}
.minibars i{width:9px;border-radius:5px 5px 2px 2px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}

/* animations */
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.r0{animation-delay:0ms}.r1{animation-delay:55ms}.r2{animation-delay:110ms}.r3{animation-delay:165ms}.r4{animation-delay:220ms}.r5{animation-delay:275ms}.r6{animation-delay:330ms}.r7{animation-delay:385ms}.r8{animation-delay:440ms}.r9{animation-delay:495ms}.r10{animation-delay:550ms}.r11{animation-delay:605ms}.r12{animation-delay:660ms}.r13{animation-delay:715ms}.r14{animation-delay:770ms}.r15{animation-delay:825ms}.r16{animation-delay:880ms}.r17{animation-delay:935ms}.r18{animation-delay:990ms}.r19{animation-delay:1045ms}.r20{animation-delay:1100ms}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,91,.6)}100%{box-shadow:0 0 0 16px rgba(255,138,91,0)}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- home ---------- */
.hero{overflow:hidden;min-height:200px}
.hero .glow{position:absolute;left:0;top:14%;width:52%;height:78%;pointer-events:none;opacity:.9}
.glow-dot{position:absolute;left:calc(52% * 300 / 320 - 6px);top:calc(14% + 78% * 18 / 200 - 6px);width:12px;height:12px;border-radius:50%;background:#dffff3;border:3px solid #1fd39a;box-shadow:0 0 14px #1fd39a;animation:fade 1s 1.2s both}
.hero-chg{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#2ee6ab,var(--mint-600));color:#043d2d;font-weight:800;font-size:14px;box-shadow:0 10px 24px -8px rgba(31,211,154,.8)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qa-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 6px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.28));border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);font-weight:700;font-size:13.5px;color:var(--ocean-900);transition:.25s}
.qa-b:hover{transform:translateY(-3px)}
.qa-b .ic{color:var(--ocean-800)}
.qa-b.hl .ic{color:var(--mint-600)}
.qa-i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.55)}

/* ---------- goals ---------- */
.goal-cover{position:relative;height:118px;border-radius:18px;overflow:hidden;display:grid;place-items:center;font-size:56px;margin:-6px -6px 14px;background-size:cover;background-position:center}
.goal-cover .emo{filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:floaty 4s ease-in-out infinite}
.goal-cover .badge-pr{position:absolute;top:10px;right:10px}
.goal-cover .badge-st{position:absolute;top:10px;left:10px}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.nowrap::-webkit-scrollbar{display:none}.chips.nowrap .chip{flex:none}
.goal-card .gc-ring{position:absolute;left:18px;top:94px;background:#fff;border-radius:50%;box-shadow:0 8px 20px -6px rgba(10,42,71,.35);padding:4px}
.add-card{border:2px dashed rgba(18,80,124,.25);background:rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;color:var(--ocean-700);font-weight:700;cursor:pointer;transition:.25s}
.add-card:hover{background:rgba(255,255,255,.75);border-color:var(--mint-600)}
.add-card .ibox{width:60px;height:60px;border-radius:20px}
.scen{border-radius:18px;padding:14px;border:2px solid transparent;background:rgba(255,255,255,.6);cursor:pointer;transition:.25s;text-align:right}
.scen.on{border-color:var(--sc);background:#fff;box-shadow:0 14px 30px -16px var(--sc)}
.scen .dotc{width:10px;height:10px;border-radius:50%;background:var(--sc);display:inline-block}
.ms-list{position:relative;padding-right:30px}
.ms-list::before{content:'';position:absolute;right:11px;top:10px;bottom:10px;width:3px;border-radius:3px;background:rgba(13,34,54,.08)}
.ms{position:relative;padding:8px 0 16px}
.ms .pt{position:absolute;right:-30px;top:10px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid rgba(13,34,54,.15);font-size:11px;z-index:1;color:#fff}
.ms.done .pt{background:var(--mint-600);border-color:var(--mint-100)}
.ms.cur .pt{background:var(--coral);border-color:var(--coral-100);animation:pulse 1.6s infinite}
.cover-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cover-pick button{height:54px;border-radius:15px;border:2px solid transparent;font-size:26px;display:grid;place-items:center;transition:.2s}
.cover-pick button.on{border-color:var(--ocean-800);transform:scale(1.05)}
.preview-goal{position:sticky;top:20px}

/* ---------- roadmap 3D ---------- */
.rm{position:relative}
.rm-stage{position:relative;height:660px;border-radius:24px;overflow:hidden;perspective:1100px;perspective-origin:50% 20%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(120% 80% at 50% 0%,#bfe6f2 0%,#e3f3f6 45%,#f1f8f6 100%);transition:--rx .9s cubic-bezier(.2,.8,.2,1),--rz .9s cubic-bezier(.2,.8,.2,1),--zoom .9s cubic-bezier(.2,.8,.2,1),--tx .9s cubic-bezier(.2,.8,.2,1),--ty .9s cubic-bezier(.2,.8,.2,1)}
.rm-stage.drag{cursor:grabbing;transition:none}
.rm-compact .rm-stage{height:300px;cursor:pointer;pointer-events:none}
.rm-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;width:120px;height:36px;border-radius:40px;background:rgba(255,255,255,.85);filter:blur(1px);animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:56px;height:56px;top:-26px;right:18px}
.cloud::after{width:40px;height:40px;top:-16px;right:62px}
.cloud.c1{top:40px;right:-140px}.cloud.c2{top:100px;right:-300px;transform:scale(.7);animation-duration:55s;animation-delay:-20s}.cloud.c3{top:20px;right:-200px;transform:scale(.5);animation-duration:70s;animation-delay:-45s}
@keyframes drift{to{right:110%}}
.rm-plane{position:absolute;left:50%;top:54%;width:400px;height:900px;margin:-450px 0 0 -200px;transform-style:preserve-3d;
  transform:scale(var(--zoom)) rotateX(var(--rx)) rotateZ(var(--rz)) translate(var(--tx),var(--ty))}
.rm-ground{position:absolute;inset:-30px -60px;border-radius:60px;background:
  radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 40%),
  repeating-linear-gradient(0deg,rgba(12,154,111,.07) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(12,154,111,.07) 0 1px,transparent 1px 40px),
  linear-gradient(180deg,#a8e8cf,#c9f1df 50%,#b2e9d2);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 40px 60px rgba(10,60,80,.25);transform-style:preserve-3d}
.rm-ground::after{content:'';position:absolute;inset:0;border-radius:60px;background:linear-gradient(180deg,#5fb79a,#2f7f6d);transform:translateZ(-26px);}
.rm-svg{position:absolute;inset:0;overflow:visible}
.rm-objs{position:absolute;inset:0;transform-style:preserve-3d}
.bb>*{transform-style:preserve-3d}
.rm-shoulder{fill:none;stroke:#f3fbf8;stroke-width:62;stroke-linecap:round}
.rm-asphalt{fill:none;stroke:#3a5568;stroke-width:46;stroke-linecap:round}
.rm-done{fill:none;stroke:url(#rmG);stroke-width:46;stroke-linecap:round;transition:stroke-dasharray 1.8s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 0 10px rgba(31,211,154,.6))}
.rm-dash{fill:none;stroke:rgba(255,255,255,.85);stroke-width:3;stroke-dasharray:14 16;animation:dashmove 1.6s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-30}}
.bb{position:absolute;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateZ(calc(-1*var(--rz))) rotateX(calc(-1*var(--rx)));pointer-events:none}
.shadow{position:absolute;width:44px;height:16px;margin:-8px 0 0 -22px;border-radius:50%;background:radial-gradient(rgba(10,42,71,.35),transparent 70%)}
.deco{font-size:34px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b83d 55%,#c98a12);border:2px solid #fbe08a;box-shadow:0 4px 8px rgba(0,0,0,.2);animation:spin 2.4s linear infinite;margin-bottom:14px}
.coin.got{opacity:.18;animation:none}
@keyframes spin{to{transform:rotateY(360deg)}}
.pin{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin .pole{width:4px;height:44px;background:linear-gradient(#fff,#9fb6c8);border-radius:3px}
.pin .head{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#fff;border:4px solid #c9d6df;box-shadow:0 10px 20px -6px rgba(10,42,71,.45);transition:transform .2s}
.pin:hover .head{transform:scale(1.12)}
.pin.done .head{background:linear-gradient(135deg,#2ee6ab,var(--mint-600));border-color:#d8f7eb;color:#fff}
.pin.cur .head{background:linear-gradient(135deg,#ffb08c,var(--coral-600));border-color:#ffe2d4;color:#fff;animation:pulse 1.6s infinite}
.pin .lbl{margin-bottom:6px;background:rgba(255,255,255,.95);border-radius:12px;padding:5px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(10,42,71,.35);text-align:center;line-height:1.5}
.pin .lbl small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
.pin.done .lbl{color:var(--mint-700)}
.car{display:flex;flex-direction:column;align-items:center}
.car .me{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#fff,#dff4fb);border:4px solid var(--coral);box-shadow:0 0 0 8px rgba(255,138,91,.25),0 14px 26px -8px rgba(10,42,71,.5);animation:floaty 2.4s ease-in-out infinite}
.car .me-l{margin-bottom:8px;background:var(--ocean-900);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:10px;white-space:nowrap}
.dest{display:flex;flex-direction:column;align-items:center}
.dest .beam{position:absolute;bottom:40px;left:50%;width:70px;height:220px;margin-left:-35px;background:linear-gradient(0deg,rgba(31,211,154,.45),transparent);filter:blur(6px);border-radius:40px;animation:fade 2s ease-in-out infinite alternate}
.dest .orb{position:relative;width:96px;height:96px;border-radius:30px;display:grid;place-items:center;font-size:50px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(220,245,236,.85));border:3px solid #fff;box-shadow:0 20px 40px -12px rgba(10,42,71,.5),0 0 0 10px rgba(31,211,154,.18);background-size:cover;background-position:center;animation:floaty 3s ease-in-out infinite}
.dest .flag{margin-bottom:8px;background:linear-gradient(135deg,var(--ocean-700),var(--ocean-900));color:#fff;padding:6px 14px;border-radius:12px;font-size:12.5px;font-weight:800;white-space:nowrap;box-shadow:0 8px 18px -6px rgba(10,42,71,.5);text-align:center;line-height:1.5}
.dest .flag small{display:block;font-weight:600;color:#a9d8c6;font-size:10.5px}
.rm-ctrl{position:absolute;bottom:14px;left:14px;display:flex;gap:6px;z-index:5;flex-wrap:wrap}
.rm-ctrl button{width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.75);backdrop-filter:blur(10px);display:grid;place-items:center;color:var(--ocean-800);font-weight:800;font-size:18px;box-shadow:0 6px 16px -6px rgba(10,42,71,.35)}
.rm-ctrl button.wide{width:auto;padding:0 12px;font-size:12.5px;gap:6px;display:flex;align-items:center}
.rm-hud{position:absolute;top:14px;right:14px;left:14px;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}
.rm-hud>div{pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:8px 12px;box-shadow:0 8px 20px -10px rgba(10,42,71,.4);font-size:12.5px}
.rm-hint{position:absolute;bottom:18px;right:16px;font-size:11.5px;color:var(--ocean-700);background:rgba(255,255,255,.7);padding:5px 10px;border-radius:10px;z-index:5;pointer-events:none}

/* ---------- gamification ---------- */
.lvl-card{overflow:hidden}
.lvl-badge{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--amber),var(--coral-600));box-shadow:0 14px 30px -10px rgba(240,109,60,.8);flex:none;position:relative}
.lvl-badge::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:200% 100%;animation:shine 3s linear infinite}
.xpbar{height:12px;border-radius:12px;background:rgba(255,255,255,.15);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--amber),var(--coral));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{text-align:center;padding:16px 10px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);transition:.25s;cursor:pointer}
.bdg:hover{transform:translateY(-3px)}
.bdg .em{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 35% 30%,#fff,#d8f7eb);box-shadow:0 10px 20px -10px rgba(18,181,131,.8),inset 0 -4px 0 rgba(18,181,131,.25)}
.bdg.lock{filter:grayscale(1);opacity:.55}
.bdg b{display:block;font-size:13px}
.bdg small{display:block;font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.streak-days{display:flex;gap:6px}
.streak-days i{flex:1;height:38px;border-radius:11px;background:rgba(13,34,54,.06);display:grid;place-items:center;font-style:normal;font-size:16px}
.streak-days i.on{background:linear-gradient(135deg,#ffb08c,var(--coral-600));box-shadow:0 8px 16px -8px rgba(240,109,60,.8)}

/* ---------- invest ---------- */
.gauge text{font-family:inherit}
.signal{border-right:4px solid var(--sig);}
.conf{display:flex;gap:3px}
.conf i{width:14px;height:6px;border-radius:3px;background:rgba(13,34,54,.1)}
.conf i.on{background:var(--sig)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:12.5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.meta div{display:flex;flex-direction:column}
.meta span{color:var(--muted);font-size:11.5px}
.meta b{font-weight:600}
.alloc-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;padding:8px 0}
.alloc-bars{position:relative;height:22px;border-radius:8px;background:rgba(13,34,54,.05)}
.alloc-bars .cur{position:absolute;right:0;top:3px;height:16px;border-radius:6px;transition:width 1s}
.alloc-bars .tgt{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--ocean-900)}
.quiz-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:14px 16px;border-radius:16px;border:2px solid rgba(13,34,54,.08);background:rgba(255,255,255,.75);font-size:14.5px;font-weight:600;transition:.2s}
.quiz-opt:hover{border-color:var(--mint-600);background:#fff}
.quiz-opt.on{border-color:var(--mint-600);background:var(--mint-100)}
.quiz-opt .k{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ocean-100);color:var(--ocean-800);font-weight:800;flex:none}
.hold{display:grid;grid-template-columns:44px 1.4fr 1fr 1fr 1fr 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0}

/* ---------- modal / sheet / toast ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(6,27,48,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.modal{width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;background:#f8fbfc;border-radius:26px;padding:22px;box-shadow:var(--shadow-lg);transform:translateY(20px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.overlay.show .modal{transform:none}
.modal h2{font-size:18px;font-weight:800}
.grabber{display:none;width:44px;height:5px;border-radius:5px;background:rgba(13,34,54,.18);margin:-8px auto 14px}
.toasts{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(7,32,56,.95);color:#fff;padding:11px 18px;border-radius:16px;font-weight:700;font-size:13.5px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;animation:tin .4s cubic-bezier(.2,.8,.2,1) both}
.toast.xp{background:linear-gradient(135deg,#f5a33d,var(--coral-600))}
.toast.ok{background:linear-gradient(135deg,var(--mint-600),var(--mint-700))}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.confetti{position:fixed;top:-12px;z-index:400;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall var(--d,2.4s) cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.8}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:#fff;font-size:12px;font-weight:700;text-align:center;box-shadow:0 4px 12px -8px rgba(10,42,71,.3)}
.more-grid a .ibox{width:40px;height:40px;border-radius:13px}
.iphone-wrap{width:420px;height:min(880px,92dvh);border-radius:60px;padding:14px;background:#0b0f14;box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 0 0 2px #2a3340;position:relative}
.iphone-wrap iframe{width:100%;height:100%;border:0;border-radius:47px;background:var(--bg)}
.iphone-wrap .island{position:absolute;top:26px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:2}

/* ---------- responsive ---------- */
@media (max-width:1200px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hold{grid-template-columns:44px 1.4fr 1fr 1fr 100px}
  .hold .h-avg{display:none}
}
@media (max-width:900px){
  body{font-size:14px}
  .sidebar{display:none}
  .bottomnav{display:flex}
  .subnav{display:flex}
  .page{padding:0 16px calc(118px + var(--safe-b))}
  .g3{grid-template-columns:minmax(0,1fr)}
  .g2.m2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2:not(.m2){grid-template-columns:minmax(0,1fr)}
  .span2,.span3{grid-column:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{padding:16px;border-radius:20px}
  .big{font-size:30px}
  .topbar{padding-top:calc(14px + var(--safe-t))}
  .tb-title{font-size:18px}
  .xp-chip span.t{display:none}
  .xp-chip{padding:5px}
  .demo-pill{display:none}
  .avatar{width:52px;height:52px;font-size:27px}
  .hello b{font-size:18px}
  .rm-stage{height:520px}
  .rm-compact .rm-stage{height:260px}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + var(--safe-b));transform:translateY(100%)}
  .grabber{display:block}
  .hold{grid-template-columns:40px 1.5fr 1fr 92px;gap:10px}
  .hold .h-price{display:none}
  .alloc-row{grid-template-columns:86px 1fr 56px}
  .qa{gap:10px}
  .minibars{gap:4px;height:44px}.minibars i{width:7px}
  .qa-b{padding:14px 4px;font-size:12.5px;border-radius:18px}
  .sec-title{font-size:16.5px}
  .preview-goal{position:static}
  .hide-m{display:none!important}
}
@media (min-width:901px){.m-only{display:none!important}}
@media (max-width:380px){.g4{grid-template-columns:minmax(0,1fr)} .qa-b{font-size:11.5px} .big{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main><div class="bg-hero"></div><div class="page" id="page"></div></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>

<script>
'use strict';
/* =========================================================
   مسیر — دموی تعاملی (فقط HTML/CSS/JS، داده‌ها نمایشی)
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NF0=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0});
const fa=n=>NF0.format(Math.round(n||0));
const fd=(n,d=1)=>new Intl.NumberFormat('fa-IR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const sgn=(n,d=1)=>(n>=0?'+':'−')+fd(Math.abs(n),d)+'٪';

function smooth(p){if(p.length<2)return '';let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`}return d}
function lineChart({series:ser,labels=[],w=innerWidth<700?360:640,h=240,yfmt=cmp,area=true,last=true,ref=null,tipfmt=null,ticks=4}){
  const pt=18,pr=12,pb=labels.length?30:10,pl=58;const all=ser.flatMap(s=>s.data).concat(ref!=null?[ref.v]:[]);let mn=Math.min(...all),mx=Math.max(...all);const sp=(mx-mn)||Math.abs(mx)||1;mn-=sp*.1;mx+=sp*.12;
  const n=Math.max(...ser.map(s=>s.data.length));const X=i=>pl+(w-pl-pr)*(n<=1?0:i/(n-1)),Y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';for(let i=0;i<=ticks;i++){const v=mn+(mx-mn)*i/ticks,y=Y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="rgba(13,34,54,.07)" stroke-dasharray="3 4"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${yfmt(v)}</text>`}
  const step=Math.ceil(labels.length/8)||1;labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`});
  if(ref)g+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(ref.v)}" y2="${Y(ref.v)}" stroke="${ref.c||'#ef4a5a'}" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${w-pr}" y="${Y(ref.v)-6}" text-anchor="end" style="fill:${ref.c||'#ef4a5a'};font-weight:700">${ref.l||''}</text>`;
  let paths='';ser.forEach((s,si)=>{if(s.hide)return;const pts=s.data.map((v,i)=>[X(i),Y(v)]);const d=smooth(pts);const id=uid();
    if(area&&!s.noArea)paths+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".28"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs><path class="fadein" d="${d} L${pts[pts.length-1][0]},${h-pb} L${pts[0][0]},${h-pb}Z" fill="url(#${id})"/>`;
    paths+=`<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2.6}" stroke-linecap="round" ${s.dash?'style="stroke-dasharray:'+s.dash+';animation:none"':''}/>`;
    if(last){const p=pts[pts.length-1];paths+=`<circle class="fadein" cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="${s.c}" stroke-width="3"/>`}});
  let cols='';for(let i=0;i<n;i++){const x0=i===0?pl:(X(i-1)+X(i))/2,x1=i===n-1?w-pr:(X(i)+X(i+1))/2;const tip=(labels[i]?labels[i]+'\n':'')+ser.filter(s=>!s.hide).map(s=>`${s.n||''}: ${(tipfmt||yfmt)(s.data[i])}`).join('\n');cols+=`<rect x="${x0}" y="${pt}" width="${Math.max(1,x1-x0)}" height="${h-pt-pb}" fill="transparent" data-tip="${esc(tip)}"/>`}
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}${paths}${cols}</svg>`}
function donut(segs,{size=160,th=22,center=''}={}){const r=(size-th)/2,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  const arcs=segs.map(s=>{const L=s.v/tot*c;const el=`<circle class="dseg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${Math.max(0,L-(segs.length>1?2.5:0))} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" data-tip="${esc(s.n+': '+fd(s.v/tot*100)+'٪'+(s.x?'\n'+s.x:''))}"/>`;off+=L;return el}).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(13,34,54,.06)" stroke-width="${th}"/>${arcs}</svg><div class="donut-c">${center}</div></div>`}
function ring(p,{size=64,th=7,color='#12b583',track='rgba(13,34,54,.08)',label=null,fs=null}={}){const r=(size-th)/2,c=2*Math.PI*r;p=clamp(p,0,100);const id=uid();
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".7"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${th}"/><circle class="ring-p" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-p/100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><span ${fs?`style="font-size:${fs}px"`:''}>${label??pc(p)}</span></div>`}
function spark(d,color,w=110,h=36){const mn=Math.min(...d),mx=Math.max(...d);const pts=d.map((v,i)=>[i/(d.length-1)*w,h-4-(v-mn)/((mx-mn)||1)*(h-8)]);const p=smooth(pts),id=uid();
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="width:${w}px;max-width:100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${p} L${w},${h} L0,${h}Z" fill="url(#${id})"/><path class="draw" pathLength="1" d="${p}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/></svg>`}
function gauge(score,max,color){const a=clamp(score/max,0,1);const R=80,cx=100,cy=95;const ang=Math.PI*(1-a);const x=cx+R*Math.cos(ang),y=cy-R*Math.sin(ang);
  return `<svg class="gauge" viewBox="0 0 200 110" width="220"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#1f7bb0"/><stop offset=".5" stop-color="#1fd39a"/><stop offset=".8" stop-color="#ff8a5b"/><stop offset="1" stop-color="#ef4a5a"/></linearGradient></defs><path d="M20 95 A80 80 0 0 1 180 95" fill="none" stroke="rgba(13,34,54,.08)" stroke-width="16" stroke-linecap="round"/><path d="M20 95 A80 80 0 0 1 180 95" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" pathLength="1" stroke-dasharray="${a} 1" class="fadein"/><circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${color}" stroke-width="5"/></svg>`}
function animateRings(root=document){setTimeout(()=>{$$('.ring-p',root).forEach(e=>e.style.strokeDashoffset=e.dataset.off);$$('[data-w]',root).forEach(e=>e.style.width=e.dataset.w)},60)}

/* ---------- toast / confetti / tooltip / modal ---------- */
function toast(msg,type=''){const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const t=document.createElement('div');t.className='toast '+type;t.innerHTML=msg;box.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2600)}
function confetti(n=90){const cols=['#1fd39a','#ff8a5b','#f5b83d','#1f7bb0','#ffffff','#ef4a5a'];for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.setProperty('--x',(Math.random()*200-100)+'px');c.style.setProperty('--r',(Math.random()*900-450)+'deg');c.style.setProperty('--d',(1.8+Math.random()*1.6)+'s');c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
const tipEl=$('#tip');
function showTip(e,txt){tipEl.textContent=txt;tipEl.classList.add('show');const x=e.clientX,y=e.clientY;const r=tipEl.getBoundingClientRect();tipEl.style.left=clamp(x-r.width/2,8,innerWidth-r.width-8)+'px';tipEl.style.top=Math.max(8,y-r.height-14)+'px'}
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(e,t.dataset.tip);else tipEl.classList.remove('show')});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&e.pointerType!=='mouse'){showTip(e,t.dataset.tip);clearTimeout(tipEl._t);tipEl._t=setTimeout(()=>tipEl.classList.remove('show'),2200)}});
let modalOpen=null;
function openModal(html,onMount){closeModal(true);const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal" role="dialog"><div class="grabber"></div>${html}</div>`;document.body.appendChild(o);modalOpen=o;requestAnimationFrame(()=>o.classList.add('show'));o.addEventListener('click',e=>{if(e.target===o)closeModal()});onMount&&onMount(o);animateRings(o)}
function closeModal(now){const o=modalOpen;if(!o)return;modalOpen=null;if(now){o.remove();return}o.classList.remove('show');setTimeout(()=>o.remove(),280)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

  objs.innerHTML=h;const car=$('.car-bb',objs),done=$('.rm-done',root);
  const W=stage.clientWidth,H=stage.clientHeight;const base=compact?clamp(Math.min(W/640,H/520),.4,.62):clamp(Math.min(W/600,H/720),.5,1);stage._s={rx:58,rz:-14,zoom:base,base,tx:0,ty:0,car:at(prog)};

      <div class="streak-days" style="margin-top:14px">${S.weeks.slice(-8).map((w,i)=>`<i class="${w?'on':''}" data-tip="هفته ${fa(i+1)}">${w?'🔥':''}</i>`).join('')}</div><div class="fs12 muted" style="margin-top:8px">هر هفته حداقل یک واریز = حفظ استریک</div></div>

  <div class="grid g4">${challenges().map((c,i)=>{const ok=c.cur>=c.goal,cl=claimed.includes(c.id);return `<div class="card ${rise(i+2)}"><div class="between"><span style="font-size:28px">${c.e}</span><span class="tag amber">+${fa(c.xp)} XP</span></div><div class="fw7" style="margin:8px 0">${c.n}</div><div class="pbar"><i data-w="${c.cur/c.goal*100}%"></i></div><div class="between fs12" style="margin-top:8px"><span class="muted">${fa(c.cur)} / ${fa(c.goal)}</span>${cl?'<span class="tag">دریافت شد ✓</span>':`<button class="btn btn-sm ${ok?'btn-c':'btn-g'}" ${ok?'':'disabled'} data-act="claim" data-id="${c.id}">دریافت جایزه</button>`}</div></div>`}).join('')}</div>

      <div class="fs12 muted" style="margin-top:8px">✓ ${fa(achieved.length)} مایل‌استون تاکنون کسب شده</div></div>
    <div class="card ${rise(8)}"><div class="ch"><h3>${ic('clock')} تاریخچه XP</h3></div>${S.xpLog.slice(0,7).map(x=>`<div class="list-item"><span class="ibox amber" style="font-size:16px">⭐</span><div class="grow"><div class="fw7 ellipsis">${esc(x.t)}</div><div class="fs12 muted">${P_FULL.format(new Date(x.d))}</div></div><b class="up">+${fa(x.xp)}</b></div>`).join('')}</div>

function suggestions(b){const out=[],T=PROFILES[S.profile].t;const top=b.list[0];
  if(top&&top.w>25)out.push({c:'coral',i:'alert',t:`ریسک تمرکز: ${top.A.n} ${pc(top.w)} از سبد`,d:'بهتر است سهم هر دارایی منفرد زیر ۲۵٪ بماند تا یک شوک قیمتی کل سبد را تحت تأثیر قرار ندهد.',go:'rebalance',b:'ریبالانس'});
  Object.keys(CLS).forEach(k=>{const d=b.clsW[k]-T[k];if(d>10)out.push({c:'amber',i:'scale',t:`${CLS[k].n} ${pc(d)} بیش از هدف پروفایل «${PROFILES[S.profile].n}»`,d:'بخشی از این دسته را به دسته‌های کم‌وزن منتقل کنید.',go:'rebalance',b:'مشاهده پیشنهاد'})});
  if(b.cls.fixed<S.expenses*3)out.push({c:'red',i:'shield',t:'صندوق اضطراری ناکافی',d:`بخش کم‌ریسک و نقدشونده (${cmp(b.cls.fixed)}) کمتر از ۳ ماه هزینه (${cmp(S.expenses*3)}) است.`,go:'categories',b:'درآمد ثابت'});
  S.goals.filter(g=>g.saved<g.price&&monthsLeft(g)<=6).forEach(g=>out.push({c:'blue',i:'target',t:`هدف «${g.name}» کمتر از ${fa(monthsLeft(g))} ماه دیگر`,d:'پول اهداف کوتاه‌مدت را در دارایی کم‌نوسان نگه دارید؛ سهام و سکه برای این افق مناسب نیستند.',go:'goal/'+g.id,b:'جزئیات هدف'}));
  if(b.list.some(x=>x.k==='silver'))out.push({c:'amber',i:'droplet',t:'نقدشوندگی پایین نقره',d:'اسپرد خرید و فروش نقره حدود ۲٫۵٪ است؛ برای پول اضطراری یا کوتاه‌مدت مناسب نیست.',go:'portfolio',b:'سبد'});
  out.push({c:'mint',i:'sparkle',t:'بهره واقعی منفی است',d:`تورم ${fd(MKT.inflation)}٪ بالاتر از سود سپرده ${fa(MKT.interest)}٪ است؛ نگهداری تمام سرمایه در درآمد ثابت قدرت خرید را کم می‌کند.`,go:'signals',b:'سیگنال‌ها'});
  return out}

/* ================= RISK ================= */
const QUIZ=[
  {q:'افق زمانی سرمایه‌گذاری شما چقدر است؟',o:['کمتر از ۱ سال','۱ تا ۳ سال','۳ تا ۵ سال','بیش از ۵ سال']},

  {q:'هدف اصلی شما از سرمایه‌گذاری چیست؟',o:['حفظ ارزش پول','درآمد ثابت و منظم','رشد متعادل','حداکثر رشد ممکن']},
  {q:'تجربه شما در بازارهای مالی چقدر است؟',o:['هیچ','کم (زیر ۱ سال)','متوسط (۱ تا ۳ سال)','زیاد (بیش از ۳ سال)']},
  {q:'چه سهمی از درآمد ماهانه را پس‌انداز می‌کنید؟',o:['کمتر از ۱۰٪','۱۰ تا ۲۰٪','۲۰ تا ۳۵٪','بیش از ۳۵٪']},
  {q:'صندوق اضطراری (پول در دسترس برای هزینه‌های پیش‌بینی‌نشده) دارید؟',o:['ندارم','کمتر از ۳ ماه هزینه','۳ تا ۶ ماه هزینه','بیش از ۶ ماه هزینه']},
];
let quiz={i:0,a:[],retake:false};
function profileOf(sc){return sc<=10?'conservative':sc<=15?'balanced':sc<=20?'growth':'aggressive'}
function pRisk(){if(S.risk&&!quiz.retake)return riskResult();const q=QUIZ[quiz.i];
  return `<div class="grid g-side"><div class="card ${rise(0)}"><div class="between"><span class="tag blue">سؤال ${fa(quiz.i+1)} از ${fa(QUIZ.length)}</span>${quiz.i>0?`<button class="btn btn-g btn-sm" data-act="qback">${ic('back',14)} قبلی</button>`:''}</div>

    <div class="col">${q.o.map((o,i)=>`<button class="quiz-opt ${quiz.a[quiz.i]===i+1?'on':''}" data-act="qa" data-v="${i+1}"><span class="k">${fa(i+1)}</span>${o}</button>`).join('')}</div></div>

function riskResult(){const sc=S.risk.score,P=PROFILES[S.profile];const near=S.goals.filter(g=>g.saved<g.price&&monthsLeft(g)<=12);
  return `<div class="grid g-side-l"><div class="card ${rise(0)}" style="text-align:center"><div class="ch"><h3>${ic('shield')} نتیجه ارزیابی</h3><span class="muted fs12">${P_FULL.format(new Date(S.risk.d))}</span></div>
    <div style="display:grid;place-items:center">${gauge(sc-6,18,P.c)}</div><div class="muted fs13">امتیاز ${fa(sc)} از ۲۴</div>
    <div style="font-size:28px;font-weight:900;color:${P.c};margin:6px 0">${P.n}</div><div class="t2">${P.d}</div>
    <div class="fs13 fw7" style="margin:18px 0 8px">تغییر دستی پروفایل</div><div class="seg">${Object.entries(PROFILES).map(([k,v])=>`<button class="${S.profile===k?'on':''}" data-act="profile" data-v="${k}">${v.n}</button>`).join('')}</div>
    <div class="row" style="justify-content:center;gap:8px;margin-top:16px"><button class="btn btn-p" data-go="rebalance">${ic('scale',16)} پیشنهاد ریبالانس</button><button class="btn btn-g" data-act="retake">${ic('refresh',16)} آزمون مجدد</button></div></div>
    <div class="card ${rise(1)}"><div class="ch"><h3>${ic('pie')} ترکیب هدف برای پروفایل شما</h3></div>

/* ================= REBALANCE ================= */
function rebPlan(b){const T=PROFILES[S.profile].t,thr=S.thr||5;const tr=[];
  Object.keys(CLS).forEach(k=>{const diff=T[k]-b.clsW[k];if(Math.abs(diff)<thr)return;const amt=Math.abs(diff)/100*b.total;
    if(diff>0)tr.push({k,side:'buy',amt,a:CLS[k].rep});else{let left=amt;b.list.filter(x=>x.A.cls===k).forEach(x=>{if(left<=1)return;const s=Math.min(left,x.value);tr.push({k,side:'sell',amt:s,a:x.k});left-=s})}});
  tr.forEach(t=>t.fee=t.amt*ASSETS[t.a].fee/100);return tr}
function pRebalance(){const b=book(),P=PROFILES[S.profile],T=P.t,tr=rebPlan(b);const fees=tr.reduce((a,t)=>a+t.fee,0);

    <div class="card ${rise(1)}"><div class="ch"><h3>${ic('bars')} وضعیت فعلی در برابر هدف</h3><span class="legend"><span><i style="background:var(--ocean-900);width:3px"></i>هدف</span></span></div>
      ${Object.keys(CLS).map(k=>{const d=b.clsW[k]-T[k];return `<div class="alloc-row"><span class="fs13 fw7">${CLS[k].n}</span><div class="alloc-bars"><div class="cur" style="width:0;background:${CLS[k].c}" data-w="${Math.min(100,b.clsW[k])}%"></div><div class="tgt" style="right:${T[k]}%"></div></div><span class="tag ${Math.abs(d)<(S.thr||5)?'':d>0?'coral':'blue'}">${sgn(d,0)}</span></div>`}).join('')}</div>
  </div>

    <div class="card ${rise(2)}">${tr.length?tr.map(t=>`<div class="list-item"><span class="ibox ${t.side==='buy'?'mint':'coral'}">${ic(t.side==='buy'?'plus':'minus')}</span><div class="grow"><div class="fw7">${t.side==='buy'?'خرید':'فروش'} ${ASSETS[t.a].n}</div><div class="fs12 muted">${CLS[t.k].n} · ≈ ${qtyTxt(t.amt/ASSETS[t.a].price,ASSETS[t.a].u)}</div></div><div style="text-align:left"><b class="num">${cmp(t.amt)}</b><div class="fs12 muted">کارمزد ${cmp(t.fee)}</div></div></div>`).join('')
      +`<div class="divider"></div><div class="between"><span class="muted">مجموع هزینه معاملات</span><b>${cmp(fees)} تومان</b></div><button class="btn btn-p btn-block" style="margin-top:14px" data-act="applyReb">${ic('check',16)} اجرای ریبالانس (شبیه‌سازی)</button>`
      :`<div class="callout mint">${ic('check',16)}<div>سبد شما در محدوده مجاز پروفایل «${P.n}» است. نیازی به ریبالانس نیست.</div></div>`}</div>
    <div class="card ${rise(3)}"><div class="ch"><h3>${ic('pie')} ترکیب پس از ریبالانس</h3></div><div class="row wrap" style="gap:18px;justify-content:center">${donut(Object.keys(CLS).map(k=>({n:CLS[k].n,v:Math.max(0,after[k]),c:CLS[k].c})),{size:150,th:24,center:`<b class="fs13">${P.n}</b>`})}
      <div class="col" style="gap:8px;font-size:13px;min-width:170px">${Object.keys(CLS).map(k=>`<div class="row"><i style="width:10px;height:10px;border-radius:3px;background:${CLS[k].c}"></i><span class="grow">${CLS[k].n}</span><span class="muted">${pc(b.clsW[k])}</span>${ic('chev',12)}<b>${pc(after[k]/atot*100)}</b></div>`).join('')}</div></div></div>
  </div>`}

/* ================= HISTORY ================= */
let hF={side:'all',a:'all'};
function pHistory(){const b=book();const rows=b.rows.filter(r=>(hF.side==='all'||r.side===hF.side)&&(hF.a==='all'||r.a===hF.a));

    <div class="row"><select class="input" style="width:auto;padding:9px 12px;font-size:14px" data-ch="hasset"><option value="all">همه دارایی‌ها</option>${Object.entries(ASSETS).map(([k,a])=>`<option value="${k}" ${hF.a===k?'selected':''}>${a.n}</option>`).join('')}</select><button class="btn btn-p btn-sm" data-act="tx">${ic('plus',15)} ثبت</button></div></div>

      <div style="text-align:left"><b class="num">${cmp(r.gross)}</b><div class="fs12 muted">کارمزد ${cmp(r.fee)}</div>${r.side==='sell'?`<div class="fs12 fw7 ${r.rp>=0?'up':'dn'}">سود ${r.rp>=0?'+':''}${cmp(r.rp)}</div>`:''}</div></div>`}).join(''):'<div class="muted" style="padding:20px;text-align:center">تراکنشی یافت نشد.</div>'}</div>`}
</script>
<script>
'use strict';
I.swap='<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>';

/* ================= modals ================= */
function depositModal(id){const g=S.goals.find(x=>x.id==id);if(!g)return;const rem=Math.max(0,g.price-g.saved);
  openModal(`${mhead('واریز به هدف',`${g.emoji} ${esc(g.name)} · ${cmp(rem)} تومان باقی‌مانده`)}
  <div class="row" style="gap:16px;margin-bottom:16px">${ring(gPct(g),{size:76,th:8})}<div class="grow"><div class="fs13 muted">پس از واریز</div><div class="fw8" style="font-size:20px" id="depAfter">${pc(gPct(g))}</div><div class="fs12 muted" id="depXp">+۲۰ XP</div></div></div>
  <div class="chips" style="margin-bottom:12px">${[1e6,5e6,10e6,20e6].map(v=>`<button class="chip" data-act="depq" data-v="${v}">${cmp(v)}</button>`).join('')}${rem>0?`<button class="chip" data-act="depq" data-v="${rem}">کل باقی‌مانده</button>`:''}</div>
  <div class="field"><label>مبلغ (تومان)</label><input class="input num" id="depAmt" inputmode="numeric" placeholder="مثلاً ۵٬۰۰۰٬۰۰۰"></div>
  <button class="btn btn-p btn-block" style="margin-top:16px;padding:14px" data-act="depok" data-id="${g.id}">${ic('check',18)} ثبت واریز</button>
  <div class="note" style="margin-top:10px">${ic('info',14)} در دمو، واریز فقط در مرورگر شما ذخیره می‌شود.</div>`,o=>{const inp=$('#depAmt',o);inp.addEventListener('input',()=>depPreview(g));setTimeout(()=>inp.focus(),300)})}
function depXP(a){return clamp(20+Math.floor(a/1e6)*3,20,200)}
function depPreview(g){const a=parseNum($('#depAmt').value);$('#depAfter').textContent=pc(clamp((g.saved+a)/g.price*100,0,100))+(a?' · +'+cmp(a):'');$('#depXp').textContent='+'+fa(depXP(a))+' XP'}
function doDeposit(id){const g=S.goals.find(x=>x.id==id);const a=parseNum($('#depAmt').value);if(!a){toast('مبلغ را وارد کنید');return}
  const before=g.saved/g.price;g.saved+=a;const after=g.saved/g.price;
  const wk=Math.floor(Date.now()/(7*DAY));if(S.lastWeek!==wk){S.lastWeek=wk;if(!S.weekDeps){S.streak++;S.weeks.push(1);S.weeks=S.weeks.slice(-8)}}S.weekDeps=(S.weekDeps||0)+1;
  closeModal();save();addXP(depXP(a),'واریز به «'+g.name+'»',a>=2e7?{big:1}:{});
  const crossed=MS.filter(m=>before<m.f&&after>=m.f);
  if(crossed.length){const m=crossed[crossed.length-1];setTimeout(()=>{confetti(m.f===1?220:110);toast(`${m.e} مایل‌استون «${m.n}» در هدف ${g.name}!`,'ok');addXP(m.f===1?300:150,`مایل‌استون ${m.n} — ${g.name}`)},500)}else confetti(40);
  render(true)}
function txModal(a='gold18',side='buy'){const b=book();
  openModal(`${mhead('ثبت تراکنش','قیمت پیش‌فرض نمایشی است — قابل ویرایش')}
  <div class="seg" id="txSide" style="margin-bottom:14px"><button data-v="buy" class="${side==='buy'?'on':''}">خرید</button><button data-v="sell" class="${side==='sell'?'on':''}">فروش</button></div>
  <div class="col" style="gap:12px"><div class="field"><label>دارایی</label><select class="input" id="txA">${Object.entries(ASSETS).map(([k,x])=>`<option value="${k}" ${k===a?'selected':''}>${x.e} ${x.n}</option>`).join('')}</select><span class="fs12 muted" id="txHeld"></span></div>
  <div class="grid g2 m2" style="gap:10px"><div class="field"><label>مقدار</label><input class="input num" id="txQ" inputmode="decimal" placeholder="۰"></div><div class="field"><label>قیمت واحد (تومان)</label><input class="input num" id="txP" inputmode="numeric"></div></div>
  <div class="card" style="box-shadow:none;background:rgba(13,34,54,.04);padding:12px"><div class="between fs13"><span class="muted">ارزش معامله</span><b id="txG">۰</b></div><div class="between fs13" style="margin-top:4px"><span class="muted">کارمزد/اسپرد</span><b id="txF">۰</b></div><div class="between" style="margin-top:6px"><span class="fw7">جمع</span><b id="txT" style="font-size:16px">۰</b></div></div>
  <button class="btn btn-p btn-block" style="padding:14px" data-act="txok">${ic('check',18)} ثبت در سبد</button></div>`,o=>{
    let sd=side;const A=$('#txA',o),Q=$('#txQ',o),P=$('#txP',o);
    const upd=()=>{const x=ASSETS[A.value],q=parseNum(Q.value),p=parseNum(P.value),g=q*p,f=g*x.fee/100;const held=(b.list.find(h=>h.k===A.value)||{qty:0}).qty;$('#txHeld',o).textContent=`موجودی شما: ${qtyTxt(held,x.u)} · کارمزد ${pc(x.fee,1)}`;$('#txG',o).textContent=fa(g);$('#txF',o).textContent=fa(f);$('#txT',o).textContent=fa(sd==='buy'?g+f:g-f)+' تومان';o._tx={a:A.value,side:sd,q,p,held}};
    const setP=()=>{P.value=fa(ASSETS[A.value].price);upd()};
    $$('#txSide button',o).forEach(bt=>bt.onclick=()=>{sd=bt.dataset.v;$$('#txSide button',o).forEach(x=>x.classList.toggle('on',x===bt));upd()});
    A.onchange=setP;Q.oninput=upd;P.oninput=upd;P.onblur=()=>{P.value=fa(parseNum(P.value))};setP()})}
function doTx(){const t=modalOpen&&modalOpen._tx;if(!t)return;if(!(t.q>0&&t.p>0)){toast('مقدار و قیمت را وارد کنید');return}
  if(t.side==='sell'&&t.q>t.held+1e-9){toast('مقدار فروش بیشتر از موجودی است');return}
  S.txs.push({id:++S.nextId,a:t.a,side:t.side,q:t.q,p:t.p,ts:Date.now()});save();closeModal();addXP(20,'ثبت '+(t.side==='buy'?'خرید ':'فروش ')+ASSETS[t.a].n);render(true)}
function msModal(gid,i){const g=S.goals.find(x=>x.id==gid);const p=plan(g),m=milestones(g,p)[i];
  openModal(`${mhead(`${m.e} ${m.n}`,`${g.emoji} ${esc(g.name)} · ${pc(m.f*100)} مسیر`)}

  <div class="callout ${m.done?'mint':''}" style="margin-top:16px">${ic(m.done?'trophy':'star',16)}<div>${m.done?'این ایستگاه را پشت سر گذاشتی! پاداش آن دریافت شده است.':`پاداش رسیدن به این ایستگاه: <b>+${fa(m.f===1?300:150)} XP</b>${m.f===1?' و نشان «فاتح هدف»':''}.`}</div></div>
  ${m.done?'':`<button class="btn btn-p btn-block" style="margin-top:14px" data-act="deposit" data-id="${g.id}">${ic('plus',16)} واریز برای نزدیک‌تر شدن</button>`}`)}
function moreModal(){openModal(`${mhead('همه بخش‌ها')}${NAV.map(s=>`<div class="fs12 fw7 muted" style="margin:12px 0 8px">${s.h||'عمومی'}</div><div class="more-grid">${s.items.map(([k,t,i])=>`<a href="#${k}"><span class="ibox">${ic(i)}</span>${t}</a>`).join('')}</div>`).join('')}
  <button class="btn btn-g btn-block" style="margin-top:18px" data-act="reset">${ic('reset',16)} بازنشانی داده‌های دمو</button>`,o=>$$('a',o).forEach(a=>a.addEventListener('click',()=>closeModal(true))))}
function searchModal(){openModal(`${mhead('جستجو')}<input class="input" id="srch" placeholder="جستجوی صفحه، هدف یا دارایی..."><div id="srchR" style="margin-top:12px"></div>`,o=>{const inp=$('#srch',o);const items=[...NAV.flatMap(s=>s.items.map(([k,t,i])=>({h:'#'+k,t,i}))),...S.goals.map(g=>({h:'#goal/'+g.id,t:g.emoji+' '+g.name,i:'target'})),...Object.values(ASSETS).map(a=>({h:'#market',t:a.e+' '+a.n,i:'activity'}))];

function notifModal(){const late=S.goals.filter(g=>status(g).k==='late');

function iphonePreview(){closeModal(true);const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="iphone-wrap"><div class="island"></div><iframe src="${location.href.split('#')[0]}#home" title="iPhone preview"></iframe></div><button class="btn btn-w" data-act="close">${ic('x',16)} بستن پیش‌نمایش</button></div>`;document.body.appendChild(o);modalOpen=o;requestAnimationFrame(()=>o.classList.add('show'));o.addEventListener('click',e=>{if(e.target===o)closeModal()})}

  upload:()=>{const f=$('#dFile');f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.img=c.toDataURL('image/jpeg',.8);$$('.cover-pick button').forEach(b=>b.classList.toggle('on',b.dataset.act==='upload'));updDraft()};im.src=rd.result};rd.readAsDataURL(file)};f.click()},
  dpri:el=>{draft.priority=el.dataset.v;$$('#dPri button').forEach(b=>b.classList.toggle('on',b===el));updDraft()},
  createGoal:()=>{const d=draft;if(!d.name.trim()){toast('نام هدف را وارد کنید');$('#dName').focus();return}if(!(d.price>0)){toast('قیمت هدف را وارد کنید');return}
    const g={id:++S.nextId,name:d.name.trim(),emoji:d.emoji,bg:d.bg,img:d.img,price:d.price,saved:Math.min(d.saved,d.price),due:inM(d.months),priority:d.priority,created:Date.now()};S.goals.push(g);S.newGoals=(S.newGoals||0)+1;S.rmGoal=g.id;save();
    confetti(120);addXP(100,`ثبت هدف «${g.name}»`);go('goal/'+g.id)},
  qa:el=>{quiz.a[quiz.i]=+el.dataset.v;el.classList.add('on');setTimeout(()=>{if(quiz.i<QUIZ.length-1){quiz.i++;render(true)}else{const sc=quiz.a.reduce((a,v)=>a+v,0);const first=!S.risk;S.risk={score:sc,a:[...quiz.a],d:Date.now()};S.profile=profileOf(sc);quiz={i:0,a:[],retake:false};save();if(first)addXP(100,'تکمیل آزمون ریسک‌پذیری');else toast('پروفایل ریسک به‌روز شد','ok');confetti(80);render(true)}},220)},
  qback:()=>{quiz.i=Math.max(0,quiz.i-1);render(true)},
  retake:()=>{quiz={i:0,a:[],retake:true};render(true)},
  profile:el=>{S.profile=el.dataset.v;save();render(true)},
  sigf:el=>{sigF=el.dataset.v;render(true)},
  cmpP:el=>{cmpP=+el.dataset.v;render(true)},
  cmpT:el=>{const k=el.dataset.v;if(cmpHide.has(k))cmpHide.delete(k);else cmpHide.add(k);render(true)},
  hside:el=>{hF.side=el.dataset.v;render(true)},
  applyReb:()=>{const b=book(),tr=rebPlan(b);tr.forEach(t=>S.txs.push({id:++S.nextId,a:t.a,side:t.side,q:t.amt/ASSETS[t.a].price,p:ASSETS[t.a].price,ts:Date.now()}));S.rebalanced++;save();confetti(90);addXP(150,'اجرای ریبالانس سبد');render(true)},
  claim:el=>{S.claimed=S.claimed||[];if(S.claimed.includes(el.dataset.id))return;const c=challenges().find(x=>x.id===el.dataset.id);S.claimed.push(c.id);save();confetti(70);addXP(c.xp,'چالش: '+c.n);render(true)},
  rm:el=>{const st=el.closest('.rm').querySelector('.rm-stage'),s=st._s;if(!s)return;const v=el.dataset.v;
    if(v==='in')s.zoom=clamp(s.zoom*1.2,.3,2.2);if(v==='out')s.zoom=clamp(s.zoom/1.2,.3,2.2);
    if(v==='reset'){Object.assign(s,{rx:58,rz:-14,zoom:s.base,tx:0,ty:0})}
    if(v==='top'){Object.assign(s,{rx:12,rz:0,zoom:s.base*.95,tx:0,ty:0})}
    if(v==='follow'){const car=st.querySelector('.car-bb');const x=parseFloat(car.style.left),y=parseFloat(car.style.top);Object.assign(s,{rx:60,rz:-8,zoom:s.base*1.6,tx:200-x,ty:450-y})}
    setCam(st)},
};
const IN={
  whatif:el=>{S.whatIf=+el.value;fillRange(el);$('#wiTxt').textContent=sgn(S.whatIf,0);$('#wiCap').textContent=fa(effCap())+' تومان در ماه';$('#goalsLive').innerHTML=goalsLive();$('#insights').innerHTML=insights();$$('#goalsLive .rise').forEach(e=>e.style.animation='none');animateRings($('#goalsLive'));clearTimeout(IN._t);IN._t=setTimeout(save,300)},
  gextra:el=>{gExtra=+el.value;fillRange(el);$('#gxTxt').textContent=sgn(gExtra,0);const g=S.goals.find(x=>x.id==el.dataset.id);$('#gxLive').innerHTML=goalWhatIf(g);$('#gproj').innerHTML=projChart(g)},
  draft:el=>{const k=el.dataset.k;if(k==='name')draft.name=el.value;else if(k==='months'){draft.months=+el.value;fillRange(el);$('#dDue').textContent=monthLabel(draft.months)+' · '+durTxt(draft.months)}else{draft[k]=parseNum(el.value);$('#d'+(k==='price'?'Price':'Saved')+'H').textContent=draft[k]?'= '+cmp(draft[k])+' تومان':'—'}updDraft()},
  thr:el=>{S.thr=+el.value;fillRange(el);$('#thrTxt').textContent=pc(S.thr);clearTimeout(IN._r);IN._r=setTimeout(()=>{save();render(true)},250)},
};
const CH={
  fin:el=>{S[el.dataset.k]=parseNum(el.value);el.value=fa(S[el.dataset.k]);save();render(true);toast('شرایط مالی به‌روز شد — رودمپ و تاریخ‌ها دوباره محاسبه شدند','ok')},
  inflate:el=>{S.inflate=el.checked;save();render(true)},
  hasset:el=>{hF.a=el.value;render(true)},
};
function updDraft(){const p=$('#dPrev');if(p){p.innerHTML=draftPreview();animateRings(p)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-go]');if(!t)return;if(t.dataset.act){if(ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t,e)}}else{e.preventDefault();go(t.dataset.go)}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-ch=fin]'))e.target.blur();if(e.key==='Enter'&&e.target.id==='depAmt')$('[data-act=depok]').click()});
window.addEventListener('hashchange',()=>{closeModal(true);render()});

/* ================= init ================= */
if(window.self!==window.top){document.documentElement.style.setProperty('--safe-t','40px');document.documentElement.style.setProperty('--safe-b','18px')}
checkBadges(true);sidebar();bottomnav();render();
</script>
</body>
</html>
