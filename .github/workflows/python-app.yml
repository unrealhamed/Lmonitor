# Runs Lmonitor's own tests on every push and pull request to main.
# The tests use small stand-ins for tkinter / pynvml / clr / pystray (tests/stubs),
# so they run on Linux without a GPU, a display or Windows drivers.
# See CONTRIBUTING.md -> "Run the tests".

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 psutil pillow
    - name: Check for syntax errors
      run: |
        # stop if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run tests
      run: python tests/run_all.py
    - name: Show details of failed tests
      if: failure()
      run: |
        for f in tests/test_*.py; do
          out=$(python -u "$f" 2>&1) || true
          if echo "$out" | grep -qE '^FAIL |Traceback|[1-9][0-9]* failed'; then
            echo "===== $f"; echo "$out" | grep -vE '^PASS ' | tail -40
          fi
        done
