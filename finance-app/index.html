<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2741">
  <title>اهداف هوشمند مالی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="phone view-home" id="phone">
    <!-- liquid colour field the glass cards blur -->
    <div class="liquid-bg" aria-hidden="true">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <div class="blob b4"></div><div class="blob b5"></div>
    </div>

    <main class="scroll" id="scroll">
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="icons">
          <svg width="20" height="13" viewBox="0 0 20 13" fill="#fff"><rect x="0" y="9" width="3.5" height="4" rx="1"/><rect x="5.3" y="6" width="3.5" height="7" rx="1"/><rect x="10.6" y="3" width="3.5" height="10" rx="1"/><rect x="15.9" y="0" width="3.5" height="13" rx="1"/></svg>
          <svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.6a11 11 0 0 1 15 0M4.2 7.6a7 7 0 0 1 9.6 0M6.9 10.4a3 3 0 0 1 4.2 0"/></svg>
          <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="#fff"/><rect x="25" y="4" width="2" height="5" rx="1" fill="#fff" opacity=".5"/></svg>
        </span>
      </div>
      <div id="view"></div>
    </main>

    <div id="overlay-slot"></div>

    <nav class="bottom-nav" id="nav" aria-label="منوی اصلی">
      <button class="nav-btn" data-nav="assets">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h10a1 1 0 0 1 0 2h-10a.5.5 0 0 0 0 1H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5v-11Zm12 7.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>
        دارایی‌ها
      </button>
      <button class="nav-btn active" data-nav="home">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M10.6 3.4a2.2 2.2 0 0 1 2.8 0l6.8 5.7c.5.4.8 1 .8 1.7V19a2 2 0 0 1-2 2h-3.5v-5.2a1.5 1.5 0 0 0-1.5-1.5h-4a1.5 1.5 0 0 0-1.5 1.5V21H5a2 2 0 0 1-2-2v-8.2c0-.7.3-1.3.8-1.7l6.8-5.7Z"/></svg>
        خانه
      </button>
      <button class="nav-btn" data-nav="achievements">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="12" width="4" height="8.5" rx="1.6"/><rect x="10" y="7.5" width="4" height="13" rx="1.6"/><rect x="16.5" y="3.5" width="4" height="17" rx="1.6"/></svg>
        گزارش‌ها
      </button>
      <button class="nav-btn" data-nav="more">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
        بیشتر
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
